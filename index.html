<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sarah Kueking</title>
  <link rel="stylesheet" href="./styles.css">
  <script src="https://kit.fontawesome.com/7d4b241e6c.js" crossorigin="anonymous"></script>
</head>
<body>
  <section id="about-me"></section>
  <nav>
    <div class="personal__logo">Sarah Kueking</div>
    <ul class="nav__link--list">
      <li>
        <a href="" class="
        nav__link--anchor
        link__hover-effect
        link__hover-effect--black
        ">Languages</a>
      </li>
      <li>
        <a href="" class="
        nav__link--anchor
        link__hover-effect
        link__hover-effect--black
        ">Projects</a>
      </li>
      <li>
        <a href="" class="
        nav__link--anchor
        nav__link--anchor-primary
        ">Contact</a>
      </li>
    </ul>
  </nav>
  <div class="flex flex-1">
    <div class="about-me__info row">
      <div class="about-me__info--container">
        <figure class="about-me__picture--mask">
          <img src="./assets/sarah-portrait-1.jpg" class="about-me__picture" alt="Picture of Me!">
        </figure>
        <h1 class="about-me__info--title">
          Hello! I'm <span class="text--blue">Sarah Kueking</span>.
        </h1>
        <p class="about-me__info--para">
          I'm an aspiring <strong class="text--blue"> frontend developer </strong> with a passion for technology and designing webpages that make people's lives easier. I also have an artistic side, as I enjoy creative writing, and I love animals and nature.
        </p>
        <div class="about-me__links">
          <a href="" class="about-me__link">
            <i class="fa-brands fa-linkedin-in"></i>
          </a>
          <a href="" class="about-me__link">
            <i class="fa-brands fa-github"></i>
          </a>
          <a href="" class="about-me__link">
            <i class="fa-regular fa-envelope"></i>
          </a>
          <a href="" class="about-me__link">
            <i class="fa-solid fa-file-pdf"></i>
          </a>
        </div>
      </div>
      <figure class="about-me__img--container">
        <img src="./assets/web-developer.svg" class="about-me__img" alt="Web Developer">
      </figure>
    </div>
  </div>
</body>
</html>
